[project]
name = "sw-mlp"
version = "1.0.4"
description = "A multilayer perceptron implemented with Numpy."
readme = "mlp/README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas==2.2.3",
]
license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend="uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "mlp"

